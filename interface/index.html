        <Tabela colunas={colsRef} linhas={refs('teste')} legenda="Teste (medição com o artefato congelado)"/>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,280px),1fr))',gap:16,marginTop:14}}>
          <MatrizConfusao titulo="Teste — modelo escolhido" classes={a.teste.modelo.classes} matriz={a.teste.modelo.matriz_confusao}/>
          <MatrizConfusao titulo="Teste — persistência" classes={a.teste.persistencia.classes} matriz={a.teste.persistencia.matriz_confusao}/>
          <MatrizConfusao titulo="Validação — modelo escolhido" classes={a.validacao.modelo.classes} matriz={a.validacao.modelo.matriz_confusao}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,520px),1fr))',gap:16,marginTop:14}}>
          <Tabela colunas={colsClasse} linhas={porClasse(a.teste.modelo)} legenda="Teste — modelo escolhido, por classe"/>
          <Tabela legenda="Teste — alertas (score ≥ limiar)" colunas={[{k:'ref',r:'Referência'},{k:'alertas',r:'Alertas',num:true,f:fmtInt},
              {k:'alertas_corretos',r:'Corretos',num:true,f:fmtInt},{k:'falsos_alertas',r:'Falsos',num:true,f:fmtInt},
              {k:'eventos_nao_alertados',r:'Não alertados',num:true,f:fmtInt},{k:'falsos_por_fluxo_hora',r:'Falsos/fluxo-h',num:true,f:v=>fmtNum(v,2)}]}
            linhas={[['Persistência','persistencia'],['Modelo','modelo'],['Modelo + classe_atual','com_classe_atual']].filter(([,k])=>al[k]).map(([ref,k])=>({ref,...al[k]}))}/>
          <Tabela legenda="Teste — inícios de evento (OK → não OK) e transições" colunas={[{k:'ref',r:'Referência'},{k:'n',r:'Inícios',num:true,f:fmtInt},
              {k:'taxa',r:'Antecip.',num:true,f:v=>fmtPct(v),dica:'inícios de evento previstos como não OK'},{k:'falha',r:'FALHA antecip.',num:true,f:v=>fmtPct(v),dica:'inícios de FALHA antecipados'},
              {k:'trans',r:'Transições',num:true,f:fmtInt},{k:'acc',r:'Acerto',num:true,f:v=>fmtPct(v),dica:'acerto da classe nas transições de estado'}]}
            linhas={[['Persistência','persistencia'],['Modelo','modelo']].filter(([,k])=>ev[k]).map(([ref,k])=>({ref, n:ev[k].inicios_nao_ok.n,
              taxa:ev[k].inicios_nao_ok.taxa_deteccao, falha:ev[k].inicios_FALHA.taxa_deteccao, trans:ev[k].transicoes ? ev[k].transicoes.n : null,
              acc:ev[k].transicoes ? ev[k].transicoes.acuracia : null}))}/>
          <Tabela legenda="Fluxos e âncoras inéditos (grupos retirados do treino)" colunas={[{k:'grupo',r:'Agrupamento',mono:true},{k:'n_grupos',r:'Grupos',num:true,f:fmtInt},
              {k:'macro_f1_media',r:'Macro-F1 (média)',num:true,f:fmtNum},{k:'macro_f1_dp',r:'Desvio-padrão',num:true,f:fmtNum},
              {k:'macro_f1_persistencia_media',r:'Persistência',num:true,f:fmtNum}]}
            linhas={Object.entries(a.grupos_ineditos||{}).map(([grupo,v])=>({grupo,...v}))}/>
        </div>
        {a.teste.calibracao_nao_ok && <div style={{fontSize:12.5,color:c.muted,marginTop:10}}>Calibração de P(não OK) no teste: Brier {fmtNum(a.teste.calibracao_nao_ok.brier,4)} · ECE {fmtNum(a.teste.calibracao_nao_ok.ece,4)}.
          É uma estimativa sobre o estado da rede, não probabilidade de fraude.</div>}
        <div style={{fontSize:11.5,color:c.faint,marginTop:8}}>Fontes: {a.fontes.join(' · ')}</div>
      </div>
    );
  };

  const AvaliacaoLavagem = ({a, modelo, artefatoBytes}) => {
    const {c} = useTema();
    if(!a.disponivel) return <Indisponivel motivo={a.motivo}/>;
    const cab = modelo && modelo.cabecas ? modelo.cabecas.lavagem || {} : {};
    const lim = cab.limites || {};
    const linha = (nome, m) => m ? ({nome, ...m}) : null;
    const t = a.teste;
    const vn = t.modelo.n - t.modelo.verdadeiros_positivos - t.modelo.falsos_positivos - t.modelo.falsos_negativos;
    const colsBin = [{k:'nome',r:'Referência'},{k:'n',r:'n',num:true,f:fmtInt},{k:'positivos',r:'Positivos',num:true,f:fmtInt},
      {k:'average_precision',r:'AP',num:true,f:v=>fmtNum(v,4)},{k:'precisao',r:'Precisão',num:true,f:fmtNum},{k:'recall',r:'Recall',num:true,f:fmtNum},
      {k:'f1',r:'F1',num:true,f:fmtNum},{k:'verdadeiros_positivos',r:'VP',num:true,f:fmtInt},{k:'falsos_positivos',r:'FP',num:true,f:fmtInt},
      {k:'falsos_negativos',r:'FN',num:true,f:fmtInt},{k:'falsos_alertas_por_10k',r:'Falsos/10 mil',num:true,f:v=>fmtNum(v,1)},{k:'limiar',r:'Limiar',num:true,f:v=>fmtNum(v,4)}];
    const padr = t.padroes;
    return (
      <div>
        <Aviso tom="info" titulo="Dados sintéticos.">Rótulos e métricas vêm do IBM AML HI-Small, um simulador. Não indicam desempenho em transações reais.</Aviso>
        <GradeKpi>
          <Kpi rotulo="Modelo escolhido" valor={a.escolhido.familia} sub={a.escolhido_nome}/>
          <Kpi rotulo="Limiar oficial" valor={fmtNum(a.escolhido.limiar_alerta,4)} sub={cab.criterio_limiar || 'máximo F1 na validação'}/>
          <Kpi rotulo="Critério de escolha" valor="average precision" sub={cab.criterio_selecao}/>
          <Kpi rotulo="Períodos (2022)" valor={lim.treino_ate ? `teste ${lim.validacao_ate.slice(5)} a ${diaAnterior(lim.teste_ate).slice(5)}` : '—'}
               sub={lim.treino_ate ? `treino ${lim.inicio.slice(5)} a ${diaAnterior(lim.treino_ate).slice(5)} · validação ${lim.treino_ate.slice(5)} a ${diaAnterior(lim.validacao_ate).slice(5)} · cauda a partir de ${lim.inicio_cauda.slice(5)} (fora)` : null}/>
        </GradeKpi>
        <h4 style={{fontSize:12.5,color:c.text,margin:'14px 0 6px'}}>Validação — comparação dos candidatos (distribuição original)</h4>
        {a.grade_validacao ? <Tabela destacar={l=>l.nome===a.escolhido_nome} colunas={[
            {k:'nome',r:'Configuração',mono:true,quebra:true},{k:'ap',r:'AP',num:true,f:v=>fmtNum(v,4)},{k:'f1',r:'F1 no limiar',num:true,f:fmtNum},
            {k:'p',r:'Precisão',num:true,f:fmtNum},{k:'r',r:'Recall',num:true,f:fmtNum},{k:'s',r:'Tempo (s)',num:true,f:v=>vazio(v)?'—':fmtNum(v,1),dica:'ajuste no treino subamostrado + previsão na validação'}]}
          linhas={a.grade_validacao.map(g=>({nome:g.nome, ap:g.validacao.average_precision, f1:g.validacao.f1_no_limiar,
             p:g.validacao.precisao_no_limiar, r:g.validacao.recall_no_limiar, s:g.validacao.segundos}))}
          legenda="Linha destacada: configuração escolhida. Cada candidato tem o próprio limiar de máximo F1 na validação."/> : <Indisponivel motivo="treino_lavagem.json ausente"/>}
        <h4 style={{fontSize:12.5,color:c.text,margin:'16px 0 6px'}}>Teste — modelo e baselines</h4>
        <Tabela colunas={colsBin} linhas={[linha('Prevalência (constante)',t.baseline_prevalencia), linha('Taxa do formato',t.baseline_formato), linha('Modelo escolhido',t.modelo)].filter(Boolean)}/>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,300px),1fr))',gap:16,marginTop:14}}>
          <MatrizConfusao titulo="Teste — modelo no limiar oficial (1 = lavagem)" classes={['1','0']}
                          matriz={[[t.modelo.verdadeiros_positivos, t.modelo.falsos_negativos],[t.modelo.falsos_positivos, vn]]}/>
          {t.modelo.por_dia_topk && <Tabela legenda="Capacidade de investigação: recall nas k transações de maior score, por dia"
              colunas={[{k:'dia',r:'Dia',mono:true},{k:'n',r:'Transações',num:true,f:fmtInt},{k:'positivos',r:'Lavagem',num:true,f:fmtInt},
                        {k:'recall@100',r:'Recall@100',num:true,f:fmtNum},{k:'recall@1000',r:'Recall@1000',num:true,f:fmtNum},{k:'recall@5000',r:'Recall@5000',num:true,f:fmtNum}]}
              linhas={Object.entries(t.modelo.por_dia_topk).map(([dia,v])=>({dia,...v}))}/>}
        </div>
        <h4 style={{fontSize:12.5,color:c.text,margin:'16px 0 6px'}}>Resultados por tipologia e positivos sem padrão (teste, no limiar)</h4>
        {padr ? <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,300px),1fr))',gap:16}}>
            <Tabela colunas={[{k:'tipo',r:'Tipologia',mono:true},{k:'n',r:'Positivos',num:true,f:fmtInt},{k:'detectados',r:'Detectados',num:true,f:fmtInt},{k:'recall',r:'Recall',num:true,f:fmtNum}]}
                    destacar={l=>l.tipo==='sem_padrao'} linhas={Object.entries(padr.recall_por_tipo).map(([tipo,v])=>({tipo,...v}))}
                    legenda="Associação documentada: transações casadas com HI-Small_Patterns.txt"/>
            <Tabela colunas={[{k:'grupo',r:'Tentativa',mono:true},{k:'n',r:'Positivos',num:true,f:fmtInt},{k:'detectados',r:'Detectados',num:true,f:fmtInt},{k:'recall',r:'Recall',num:true,f:fmtNum}]}
                    linhas={Object.entries(padr.recall_por_inicio_da_tentativa).map(([grupo,v])=>({grupo,...v}))}
                    legenda="Tentativas iniciadas antes do teste deixam o recall otimista"/>
          </div> : <Indisponivel motivo="HI-Small_Patterns.txt não estava disponível na avaliação"/>}
        {a.cauda && a.cauda.modelo && <Aviso tom="aviso" titulo="Cauda do gerador (11–18/09), fora das métricas principais:">AP {fmtNum(a.cauda.modelo.average_precision)} com
          {' '}{fmtInt(a.cauda.modelo.n)} transações e prevalência de {fmtPct(a.cauda.modelo.prevalencia)} — número inflado pela base, não representa operação.</Aviso>}
        <div style={{fontSize:12.5,color:c.muted,marginTop:6}}>Calibração do score no teste: Brier {fmtNum(t.calibracao && t.calibracao.brier,6)} · ECE {fmtNum(t.calibracao && t.calibracao.ece,6)} —
          valores baixos porque quase todos os scores ficam perto de zero; o score continua sendo só uma ordenação.
          Tamanho do artefato unificado (todas as cabeças): {fmtBytes(artefatoBytes)}. Memória: não medida pelo NodeWatch.</div>
        <div style={{fontSize:11.5,color:c.faint,marginTop:8}}>Fontes: {a.fontes.join(' · ')}</div>
      </div>
    );
  };

  const Exploratoria = ({dominio, fonteId, filtros, descricao}) => {
    const {c} = useTema();
    const res = useCarga(fonteId ? `/fontes/${caminhoFonte(fonteId)}/resumo?${consulta(filtros)}` : null);
    const r = res.dados;
    const d = descricao && descricao.dados;
    const ativos = Object.values(filtros).filter(v=>Array.isArray(v)?v.length:!vazio(v)).length;
    return (
      <div style={{minWidth:0}}>
        <h4 style={{fontSize:12.5,color:c.text,margin:'0 0 6px'}}>{DOMINIO_NOME[dominio]}</h4>
        <div style={{fontSize:12,color:c.muted,marginBottom:8}}>{d ? <><code>{d.nome_arquivo}</code> · {ativos ? `${ativos} filtro(s) da área de análise` : 'sem filtros'}{r ? ` · ${fmtInt(r.total_filtrado)} registros` : ''}</> : 'nenhum arquivo selecionado'}</div>
        <CaixaErro erro={res.erro}/>
        {!fonteId ? null : !r ? <Carregando/> : !r.rotulos.disponivel ? <Aviso tom="info" titulo="Métricas indisponíveis:">{r.rotulos.motivo}</Aviso> : (
          dominio==='rede' ? <div>
              <MatrizConfusao titulo={`Exploratória — ${fmtInt(r.rotulos.n)} registros filtrados`} classes={r.rotulos.classes} matriz={r.rotulos.matriz_confusao}/>
              <div style={{fontSize:12.5,marginTop:6}}>Macro-F1 {fmtNum(r.rotulos.macro_f1)} · alerta × não OK: precisão {fmtNum(r.rotulos.alerta_nao_ok.precisao)}, recall {fmtNum(r.rotulos.alerta_nao_ok.recall)}</div>
            </div>
          : <div>
              <MatrizConfusao titulo={`Exploratória — ${fmtInt(r.rotulos.n)} registros, ${fmtInt(r.rotulos.positivos)} positivos`} classes={['1','0']}
                matriz={[[r.rotulos.matriz_confusao.vp, r.rotulos.matriz_confusao.fn],[r.rotulos.matriz_confusao.fp, r.rotulos.matriz_confusao.vn]]}/>
              <div style={{fontSize:12.5,marginTop:6}}>Precisão {fmtNum(r.rotulos.precisao)} · recall {fmtNum(r.rotulos.recall)} · F1 {fmtNum(r.rotulos.f1)} · AP {fmtNum(r.rotulos.average_precision,4)}</div>
            </div>
        )}
        {d && d.conjunto.tipo==='amostra' && <div style={{fontSize:11.5,color:c.amber,marginTop:6}}>Arquivo é amostra: não generalize para o conjunto.</div>}
      </div>
    );
  };

  const AvaliacaoModelos = ({avaliacao, erro, selecao, filtros, descricoes}) => {
    const {c} = useTema();
    return (
      <div>
        <CaixaErro erro={erro}/>
        {!avaliacao && !erro && <Carregando texto="Lendo os resultados oficiais…"/>}
        {avaliacao && <>
          <Aviso tom="aviso" titulo="Reuso do conjunto de teste.">{avaliacao.reuso_do_teste}</Aviso>
          <GlossarioMetricas/>
          <Painel titulo="Avaliação oficial — rede (estado da próxima medição)"><AvaliacaoRede a={avaliacao.rede} modelo={avaliacao.modelo}/></Painel>
          <Painel titulo="Avaliação oficial — lavagem (HI-Small, sintético)"><AvaliacaoLavagem a={avaliacao.lavagem} modelo={avaliacao.modelo} artefatoBytes={avaliacao.modelo && avaliacao.modelo.artefato_bytes}/></Painel>
        </>}
        <Painel titulo="Análise exploratória dos registros filtrados (não é a avaliação oficial)">
          <div style={{fontSize:12.5,color:c.muted,marginBottom:12}}>Usa o arquivo e os filtros escolhidos em cada área de análise. Métricas que dependem de
            rótulos só aparecem se o próprio arquivo trouxer o rótulo de referência (<code>alvo</code> na rede, <code>Is Laundering</code> na lavagem).</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,320px),1fr))',gap:20}}>
            {['rede','lavagem'].map(dm=><Exploratoria key={dm} dominio={dm} fonteId={selecao[dm]} filtros={filtros[dm]} descricao={descricoes[dm]}/>)}
          </div>
        </Painel>
      </div>
    );
  };

  /* ── Sessão de uso da interface ─────────────────────────────────
     Uma por aba (sessionStorage: recarregar a aba mantém a sessão). Vive no Dashboard, então trocar entre
     Grafos e ML não a afeta. Só autoriza: abrir ou renovar uma sessão nunca inicia nem retoma trabalho.
     Aba em segundo plano continua renovando (o navegador espaça os temporizadores; o prazo do servidor cobre
     isso). Aba fechada para de renovar e a sessão expira no prazo informado por /sessao. */
  function useSessaoML(){
    const [s, setS] = React.useState({estado:'abrindo', id:null, politica:null, renovadaEm:null, aviso:null});
    const abrir = React.useCallback(async (aviso) => {
      try {
        const r = await fetch(ML_API+'/sessao', {method:'POST', headers:{'Content-Type':'application/json'},
                              body:JSON.stringify({rotulo:'aba do navegador'})});
        if(!r.ok) throw new Error(String(r.status));
        const d = await r.json();
        window.NODEWATCH_SESSAO = d.sessao.id;
        try { sessionStorage.setItem('nw_sessao', d.sessao.id); } catch(e){}
        setS({estado:'ativa', id:d.sessao.id, politica:d.politica, renovadaEm:new Date(), aviso:aviso||null});
      } catch(e){
        setS(x=>({...x, estado:'sem_conexao'}));
      }
    }, []);
    const pulso = React.useCallback(async () => {
      const id = window.NODEWATCH_SESSAO;
      if(!id) return;
      try {
        const r = await fetch(ML_API+'/sessao/pulso', {method:'POST', headers:{'X-NodeWatch-Sessao':id}});
        if(r.status===410){
          window.NODEWATCH_SESSAO = null;
          abrir('A sessão anterior desta aba expirou (ficou sem contato além do prazo). O que ela processava parou no ponto seguro seguinte e continua parado: retome explicitamente abaixo.');
          return;
        }
        if(!r.ok) throw new Error(String(r.status));
        setS(x=>({...x, estado:'ativa', renovadaEm:new Date()}));
      } catch(e){
        setS(x=>({...x, estado:'sem_conexao'}));
      }
    }, [abrir]);
    const encerrar = React.useCallback(async () => {
      const id = window.NODEWATCH_SESSAO;
      window.NODEWATCH_SESSAO = null;
      try { sessionStorage.removeItem('nw_sessao'); } catch(e){}
      setS(x=>({...x, estado:'encerrada', id:null, aviso:null}));
      if(id){ try { await fetch(ML_API+'/sessao/encerrar', {method:'POST', headers:{'X-NodeWatch-Sessao':id}}); } catch(e){} }
    }, []);
    React.useEffect(()=>{
      let salva = null;
      try { salva = sessionStorage.getItem('nw_sessao'); } catch(e){}
      (async () => {
        if(salva){
          try {
            const r = await fetch(ML_API+'/sessao/pulso', {method:'POST', headers:{'X-NodeWatch-Sessao':salva}});
            if(r.ok){
              const d = await (await fetch(ML_API+'/sessao', {headers:{'X-NodeWatch-Sessao':salva}})).json();
              window.NODEWATCH_SESSAO = salva;
              setS({estado:'ativa', id:salva, politica:d.politica, renovadaEm:new Date(), aviso:null});
              return;
            }
          } catch(e){ setS(x=>({...x, estado:'sem_conexao'})); }
          abrir('A sessão anterior desta aba não existe mais (expirou ou o servidor reiniciou). Nada foi retomado: veja abaixo o que ficou parado.');
          return;
        }
        abrir();
      })();
    }, [abrir]);
    const pulsoMs = 1000 * ((s.politica && s.politica.pulso_s) || 15);
    React.useEffect(()=>{
      const id = setInterval(pulso, pulsoMs);
      const aoVoltar = () => { if(document.visibilityState==='visible') pulso(); };
      document.addEventListener('visibilitychange', aoVoltar);
      window.addEventListener('online', pulso);
      return () => { clearInterval(id); document.removeEventListener('visibilitychange', aoVoltar); window.removeEventListener('online', pulso); };
    }, [pulso, pulsoMs]);
    return {...s, ativa:s.estado==='ativa', abrir:()=>abrir(), encerrar};
  }

  const BarraSessao = ({sessao}) => {
    const {c} = useTema();
    const ttl = sessao.politica && sessao.politica.ttl_s;
    const texto = {
      abrindo:'abrindo sessão…',
      ativa:`renovada às ${sessao.renovadaEm ? sessao.renovadaEm.toLocaleTimeString('pt-BR') : '—'}`,
      sem_conexao:`sem conexão com o servidor; se durar mais de ${ttl||'—'} s, a sessão expira e o trabalho dela para`,
      encerrada:'encerrada nesta aba: nada novo é processado até abrir outra sessão',
    }[sessao.estado];
    const tom = {ativa:'ok', sem_conexao:'perigo', encerrada:'aviso'}[sessao.estado] || 'neutro';
    return (
      <div style={{marginBottom:12}}>
        {sessao.aviso && <Aviso tom="aviso" titulo="Sessão renovada.">{sessao.aviso}</Aviso>}
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',fontSize:12.5,color:c.muted,
                     background:c.panelLow,border:`1px solid ${c.borderSoft}`,borderRadius:8,padding:'8px 12px'}}>
          <strong style={{color:c.text}}>Sessão da interface</strong>
          <Selo tom={tom}>{{ativa:'ativa', abrindo:'abrindo', sem_conexao:'sem conexão', encerrada:'encerrada'}[sessao.estado]}</Selo>
          <span style={{flex:'1 1 240px',minWidth:0}}>{texto}. Minimizar ou trocar de aba não encerra; sem contato por {ttl||'—'} s (aba fechada, navegador caído), o trabalho para no ponto seguro seguinte.</span>
          {sessao.estado==='encerrada' || sessao.estado==='sem_conexao'
            ? <button type="button" style={estiloBotao(c,'primario')} onClick={sessao.abrir}>Abrir nova sessão</button>
            : <button type="button" style={estiloBotao(c,'perigo')} disabled={!sessao.ativa}
                      title="O que esta sessão processa para no próximo ponto seguro, com checkpoint"
                      onClick={()=>{ if(window.confirm('Encerrar a sessão? O que ela processa para no próximo ponto seguro; resultados ficam parciais até uma retomada explícita.')) sessao.encerrar(); }}>Encerrar sessão</button>}
        </div>
      </div>
    );
  };

  /* ── Eventos: replay histórico, ingestão, previsão sob demanda e simulação ──
     Aqui o modelo salvo GERA previsões novas (carregado uma vez pelo servidor);
     nada é treinado. Nenhuma fonte é chamada de "ao vivo": o replay reenvia
     arquivos existentes e a API só recebe o que um produtor enviar. */
  const ROTULO_MODO = {replay_historico:'Replay histórico', novo_evento:'API de ingestão', simulacao:'Simulação'};
  const TOM_MODO = {replay_historico:'info', novo_evento:'ok', simulacao:'aviso'};
  const SITUACAO_REPLAY = {parado:'parado', preparando:'preparando arquivo', carregando_historico:'carregando histórico',
    rodando:'rodando', pausando:'pausando (gravando estado)', pausado:'pausado', concluido:'concluído', erro:'erro'};
  const INTERVALOS = [[2000,'a cada 2 s'],[5000,'a cada 5 s'],[15000,'a cada 15 s'],[0,'parada']];
  const fmtMs = v => vazio(v) ? '—' : v >= 1000 ? _nf(1,1).format(v/1000)+' s' : _nf(0,1).format(v)+' ms';
  const somaValores = o => Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);

  /* Consulta periódica; intervalo 0 = só quando pedir. */
  function useConsultaPeriodica(caminho, intervalo){
    const [estado, setEstado] = React.useState({dados:null, erro:null, tick:0});
    const carregar = React.useCallback(()=>{
      apiML(caminho).then(d=>setEstado(e=>({dados:d, erro:null, tick:e.tick+1})))
                    .catch(err=>setEstado(e=>({...e, erro:err})));
    }, [caminho]);
    React.useEffect(()=>{
      carregar();
      if(!intervalo) return;
      const id = setInterval(carregar, intervalo);
      return ()=>clearInterval(id);
    }, [carregar, intervalo]);
    return {...estado, recarregar:carregar};
  }

  const BarraProgresso = ({fracao, rotulo}) => {
    const {c,mono} = useTema();
    const p = Math.max(0, Math.min(1, fracao||0));
    return (
      <div>
        <div role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(p*100)} aria-label={rotulo}
             style={{height:8,background:c.panelLow,border:`1px solid ${c.borderSoft}`,borderRadius:5,overflow:'hidden'}}>
          <div style={{width:`${p*100}%`,height:'100%',background:c.primary,transition:'width .3s'}}/>
        </div>
        <div style={{fontFamily:mono,fontSize:11.5,color:c.muted,marginTop:4}}>{rotulo}</div>
      </div>
    );
  };

  const StatusEventos = ({st, ocupado}) => {
    const s = st.servico;
    const recentes = (s.modos||[]).filter(m=>m.recente);
    const lat = s.latencia_ms || {};
    const fin = s.financeiro || {};
    const cont = s.contadores || {};
    const recusadosApi = Object.entries((s.api||{}).contadores||{}).filter(([k])=>k.startsWith('recusados_'))
                               .reduce((a,[,v])=>a+v,0);
    const recusados = somaValores(s.rejeitados) + recusadosApi;
    const detalheRecusas = Object.entries(s.rejeitados||{}).map(([k,v])=>`${k}: ${v}`)
                                 .concat(recusadosApi ? [`na entrada: ${recusadosApi}`] : []).join(' · ');
    const latencia = l => l && l.n ? `${fmtMs(l.p50)} · ${fmtMs(l.p95)} · ${fmtMs(l.p99)}` : '—';
    return (
      <>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:12,fontSize:13}}>
          <strong>Modo ativo:</strong>
          {recentes.length ? recentes.map(m=><Selo key={m.modo} tom={TOM_MODO[m.modo]}>{ROTULO_MODO[m.modo]}</Selo>)
                           : <Selo>nenhum evento no último minuto</Selo>}
          <Selo tom={s.trabalhador_ativo?'ok':'neutro'}>{s.trabalhador_ativo?'trabalhador ativo':'trabalhador parado'}</Selo>
          {ocupado && <Selo tom="aviso" title="O trabalhador está ocupado (por exemplo, carregando o histórico); os números podem estar alguns segundos atrasados.">ocupado</Selo>}
        </div>
        <GradeKpi min={150}>
          <Kpi rotulo="Última atualização" valor={s.ultima_atualizacao_utc ? fmtData(s.ultima_atualizacao_utc) : '—'} sub="UTC, relógio do servidor"/>
          <Kpi rotulo="Previsões de rede" valor={fmtInt(cont.previsoes_rede||0)}/>
          <Kpi rotulo="Previsões de lavagem" valor={fmtInt(cont.previsoes_lavagem||0)}/>
          <Kpi rotulo="Fila pendente" valor={fmtInt(s.fila.pendentes)} sub={`capacidade ${fmtInt(s.fila.capacidade)} · cheia = recusa`}
               tom={s.fila.pendentes > 0.8*s.fila.capacidade ? 'aviso' : undefined}/>
          <Kpi rotulo="Minutos abertos" valor={fmtInt(fin.minutos_abertos||0)}
               sub={`${fmtInt(fin.pendentes_em_minutos_abertos||0)} transações aguardando o minuto fechar`}/>
          <Kpi rotulo="Recusados" valor={fmtInt(recusados)} sub={detalheRecusas || 'nenhum'} tom={recusados ? 'aviso' : undefined}/>
          <Kpi rotulo="Falhas" valor={fmtInt(cont.falhas||0)} tom={cont.falhas ? 'alerta' : undefined}
               sub={(s.falhas||[]).length ? s.falhas[s.falhas.length-1].erro : 'nenhuma'}/>
        </GradeKpi>
        <GradeKpi min={220}>
          <Kpi rotulo="Latência rede (chegada → previsão)" valor={latencia(lat.rede)}
               sub={lat.rede && lat.rede.n ? `p50 · p95 · p99 das últimas ${fmtInt(lat.rede.n)}; inclui a espera na fila` : 'sem previsões ainda'}/>
          <Kpi rotulo="Latência lavagem (chegada → previsão)" valor={latencia(lat.lavagem)}
               sub={lat.lavagem && lat.lavagem.n ? 'inclui a espera até o minuto da transação fechar' : 'sem previsões ainda'}/>
          <Kpi rotulo="Estado financeiro" valor={fin.ultimo_minuto_fechado_utc ? fmtData(fin.ultimo_minuto_fechado_utc) : '—'}
               sub={`último minuto fechado · observação desde ${fin.inicio_observacao_utc ? fmtData(fin.inicio_observacao_utc) : '—'} · ${fmtInt(fin.contas||0)} contas · ${fmtInt(fin.pares||0)} pares`}/>
        </GradeKpi>
        {fin.carga_inicial && <Aviso tom="info" titulo="Carga inicial:">{fmtInt(fin.carga_inicial.transacoes)} transações de {fin.carga_inicial.descricao}.</Aviso>}
      </>
    );
  };

  const ControleReplay = ({fonte, arquivo, replay, historico, velocidades, onAcao, trabalhando}) => {
    const {c} = useTema();
    const [vel, setVel] = React.useState(fonte==='rede' ? 500 : 2000);
    const [usarHist, setUsarHist] = React.useState(false);
    const sit = replay ? replay.situacao : 'parado';
    const rodando = ['preparando','carregando_historico','rodando','pausando'].includes(sit);
    const nome = fonte==='rede' ? 'Rede — medições rede_v1' : 'Financeiro — transações HI-Small';
    if(!arquivo) return <Aviso tom="aviso" titulo={nome+':'}>arquivo de exemplo não encontrado. Gere com <code>python -m src.ml.cli exemplos</code>.</Aviso>;
    return (
      <div style={{border:`1px solid ${c.borderSoft}`,borderRadius:8,padding:'12px 14px',minWidth:0}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:8}}>
          <strong style={{fontSize:13.5}}>{nome}</strong>
          <Selo tom={sit==='erro'?'perigo':sit==='concluido'?'ok':rodando?'info':'neutro'}>{SITUACAO_REPLAY[sit]||sit}</Selo>
        </div>
        <div style={{fontSize:12,color:c.muted,marginBottom:8,overflowWrap:'anywhere'}}>Arquivo: <code>{arquivo}</code> · em ordem cronológica</div>
        {replay && !vazio(replay.total) && <BarraProgresso fracao={replay.progresso}
                     rotulo={`${fmtInt(replay.processados)} de ${fmtInt(replay.total)} processados (${fmtPct(replay.progresso)})`}/>}
        {replay && replay.mensagem && <div style={{fontSize:12,color:sit==='erro'?c.danger:c.muted,marginTop:6}}>{replay.mensagem}</div>}
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end',marginTop:10}}>
          <Campo rotulo="Velocidade">
            <select value={vel} onChange={e=>setVel(+e.target.value)} disabled={rodando}>
              {velocidades.map(v=><option key={v} value={v}>{v ? `${fmtInt(v)} eventos/s` : 'máxima'}</option>)}
            </select>
          </Campo>
          {fonte==='financeiro' && historico && historico.disponivel &&
            <label style={{fontSize:12.5,display:'flex',gap:6,alignItems:'center',maxWidth:360}}>
              <input type="checkbox" checked={usarHist} onChange={e=>setUsarHist(e.target.checked)} disabled={rodando}/>
              Montar o estado antes com o histórico ({historico.arquivo}, transações anteriores ao arquivo; cerca de 1 min)
            </label>}
          {(!replay || ['parado','concluido','erro'].includes(sit)) &&
            <button type="button" disabled={trabalhando} style={estiloBotao(c,'primario')}
                    onClick={()=>onAcao({fonte, acao:'iniciar', eventos_por_segundo:vel, usar_historico:usarHist})}>
              {replay && replay.processados>0 && (vazio(replay.total) || replay.processados<replay.total) ? 'Continuar replay' : 'Iniciar replay'}</button>}
          {['rodando','preparando'].includes(sit) &&
            <button type="button" disabled={trabalhando} style={estiloBotao(c)} onClick={()=>onAcao({fonte, acao:'pausar'})}>Pausar</button>}
          {sit==='pausado' &&
            <button type="button" disabled={trabalhando} style={estiloBotao(c,'primario')} onClick={()=>onAcao({fonte, acao:'retomar'})}>Retomar</button>}
          {replay && !['parado','concluido','erro'].includes(sit) &&
            <button type="button" disabled={trabalhando} style={estiloBotao(c,'perigo')} onClick={()=>onAcao({fonte, acao:'parar'})}>Parar</button>}
        </div>
        {fonte==='financeiro' && (!historico || !historico.disponivel) &&
          <div style={{fontSize:11.5,color:c.faint,marginTop:8}}>Sem o HI-Small completo configurado em <code>ml_config.local.toml</code>, as contas começam sem passado e as previsões das primeiras 72 h saem com histórico incompleto.</div>}
      </div>
    );
  };

  const COLUNAS_RECENTES = {
    rede: [
      {k:'timestamp_previsao', r:'Medição', f:fmtTsRede, mono:true},
      {k:'id_fluxo', r:'Fluxo', mono:true},
      {k:'classe_prevista', r:'Próxima medição'},
      {k:'score_alerta_rede', r:'Score', num:true, f:v=>fmtNum(v,3)},
      {k:'alerta_rede', r:'Alerta', f:simNao},
      {k:'modo_evento', r:'Modo', f:v=>ROTULO_MODO[v]||v},
      {k:'processado_em_utc', r:'Processado (UTC)', f:fmtData, mono:true},
    ],
    lavagem: [
      {k:'timestamp_transacao', r:'Transação', mono:true},
      {k:'id_transacao', r:'Id', mono:true},
      {k:'conta_origem', r:'Origem', mono:true},
      {k:'valor_pago', r:'Valor', num:true, f:v=>fmtNum(v,2)},
      {k:'moeda_pagamento', r:'Moeda'},
      {k:'score_lavagem', r:'Score', num:true, f:v=>fmtNum(v,3)},
      {k:'alerta_lavagem', r:'Alerta', f:simNao},
      {k:'historico_incompleto', r:'Hist. incompleto', f:simNao},
      {k:'cobertura_vinculo', r:'Vínculo com rede'},
      {k:'modo_evento', r:'Modo', f:v=>ROTULO_MODO[v]||v},
    ],
    rejeicoes: [
      {k:'em', r:'Quando (UTC)', f:fmtData, mono:true},
      {k:'id_evento', r:'Evento', mono:true},
      {k:'motivo', r:'Motivo'},
      {k:'problemas', r:'Detalhe', quebra:true, f:v=>Array.isArray(v)?v.join('; '):v},
    ],
  };

  const Recentes = ({tick}) => {
    const {c} = useTema();
    const [dominio, setDominio] = React.useState('lavagem');
    const {dados, erro} = useConsultaPeriodica(`/eventos/recentes?dominio=${dominio}&n=20&t=${tick}`, 0);
    return (
      <Painel titulo="Últimas previsões" extra={
        <div role="tablist" aria-label="Domínio" style={{display:'flex',gap:4}}>
          {[['lavagem','Lavagem'],['rede','Rede'],['rejeicoes','Recusas']].map(([id,n])=>(
            <button key={id} type="button" role="tab" aria-selected={dominio===id} onClick={()=>setDominio(id)}
                    style={{...estiloBotao(c, dominio===id?'primario':undefined), padding:'4px 10px'}}>{n}</button>))}
        </div>}>
        <CaixaErro erro={erro}/>
        {dados && dados.linhas.length===0 && <SemDados texto="Nada ainda. Inicie um replay ou envie eventos pela API."/>}
        {dados && dados.linhas.length>0 && <Tabela colunas={COLUNAS_RECENTES[dominio]} linhas={dados.linhas}
            legenda={dominio==='lavagem' ? 'O score de lavagem foi aprendido em dados sintéticos e não é fraude confirmada.' :
                     dominio==='rede' ? 'Estado previsto da próxima medição do fluxo; não é fraude.' : undefined}/>}
      </Painel>
    );
  };

  const PrevisaoCSV = ({sessao, onAbrirFonte}) => {
    const {c} = useTema();
    const [arquivo, setArquivo] = React.useState(null);
    const [enviando, setEnviando] = React.useState(false);
    const [res, setRes] = React.useState(null);
    const [erro, setErro] = React.useState(null);
    const enviar = async ev => {
      ev.preventDefault();
      setEnviando(true); setErro(null); setRes(null);
      try {
        const fd = new FormData(); fd.append('arquivo', arquivo);
        setRes(await apiML('/prever/rede/csv', {method:'POST', body:fd}));
      } catch(e){ setErro(e); } finally { setEnviando(false); }
    };
    return (
      <Painel titulo="Gerar previsões de rede a partir de um CSV">
        <p style={{fontSize:13,margin:'0 0 10px',color:c.text}}>O CSV precisa seguir <code>rede_v1</code> (atributos já preparados; <code>alvo</code> e <code>split</code> são opcionais e não entram no modelo). O servidor usa o modelo salvo, sem treinar, e grava o resultado em <code>artefatos_ml/previsoes</code>, onde ele aparece na Análise de rede.</p>
        <form onSubmit={enviar} style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <Campo rotulo="Arquivo CSV (rede_v1)"><input type="file" accept=".csv,text/csv" onChange={e=>setArquivo(e.target.files[0]||null)}/></Campo>
          <button type="submit" disabled={!arquivo||enviando||!sessao.ativa} style={{...estiloBotao(c,'primario'),opacity:!arquivo||enviando||!sessao.ativa?0.5:1}}>
            {enviando ? 'Gerando…' : 'Gerar previsões'}</button>
        </form>
        <div style={{marginTop:10}}><CaixaErro erro={erro}/></div>
        {res && <Aviso tom="ok" titulo="Pronto:">{fmtInt(res.linhas_previstas)} previsões em <code>{res.arquivo}</code>.
          {res.colunas_psi_acima_0_25 && res.colunas_psi_acima_0_25.length>0 && <> Deriva relevante (PSI ≥ 0,25) em: {res.colunas_psi_acima_0_25.join(', ')}.</>}
          {' '}<button type="button" style={{...estiloBotao(c,'primario'),padding:'3px 10px'}} onClick={()=>onAbrirFonte('rede', res.fonte_id)}>Abrir na Análise de rede</button></Aviso>}
      </Painel>
    );
  };

  const Fusao = ({st, sessao}) => {
    const {c} = useTema();
    const [lab, setLab] = React.useState(null);
    const [rodando, setRodando] = React.useState(false);
    const [erro, setErro] = React.useState(null);
    React.useEffect(()=>{ apiML('/eventos/laboratorio').then(d=>setLab(d.relatorio)).catch(()=>{}); }, []);
    const executar = async () => {
      setRodando(true); setErro(null);
      try { setLab((await apiML('/eventos/laboratorio', {method:'POST'})).relatorio); }
      catch(e){ setErro(e); } finally { setRodando(false); }
    };
    const f = st.servico.fusao;
    const cartoes = [
      ['Integração técnica', f.integracao_tecnica, 'ok', 'pronta'],
      ['Cenário simulado', lab ? (lab.todos_ok ? 'executado: todos os casos conferem' : 'executado: há divergências') : f.cenario_simulado,
       lab ? (lab.todos_ok ? 'ok' : 'perigo') : 'neutro', lab ? (lab.todos_ok ? 'confere' : 'divergência') : 'não executado'],
      ['Validação preditiva', f.validacao_preditiva, 'aviso', 'pendente'],
    ];
    return (
      <Painel titulo="Rede + transações" extra={<Selo tom="aviso">fusão indisponível</Selo>}>
        <Aviso tom="info">{f.aviso} Vínculos aceitos: {fmtInt(st.servico.vinculos)} · fluxos com sinal: {fmtInt(st.servico.fluxos_com_sinal)}.</Aviso>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,220px),1fr))',gap:10,marginBottom:14}}>
          {cartoes.map(([t,txt,tom,selo])=>(
            <div key={t} style={{border:`1px solid ${c.borderSoft}`,borderRadius:8,padding:'10px 12px'}}>
              <div style={{display:'flex',justifyContent:'space-between',gap:6,marginBottom:4}}>
                <strong style={{fontSize:12.5}}>{t}</strong><Selo tom={tom}>{selo}</Selo></div>
              <div style={{fontSize:12,color:c.muted}}>{txt}</div>
            </div>))}
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
          <button type="button" onClick={executar} disabled={rodando || !st.laboratorio_disponivel || !sessao.ativa} style={estiloBotao(c,'primario')}>
            {rodando ? 'Executando…' : 'Executar laboratório de simulação'}</button>
          <Selo tom="aviso">SIMULAÇÃO</Selo>
          {!st.laboratorio_disponivel && <span style={{fontSize:12,color:c.muted}}>precisa de artefatos_ml/exemplos/rede_teste_sem_rotulos.csv</span>}
        </div>
        <CaixaErro erro={erro}/>
        {lab && <>
          <Aviso tom="aviso">{lab.aviso}</Aviso>
          <Tabela legenda={`Casos de vínculo (${lab.arquivo_rede}, tolerância ${fmtInt(lab.tolerancia_sinal_s)} s) — executado em ${fmtData(lab.gerado_em)} UTC`}
            colunas={[{k:'descricao',r:'Caso',quebra:true},{k:'esperado',r:'Esperado'},{k:'obtido',r:'Obtido'},
                      {k:'idade_sinal_s',r:'Idade do sinal',num:true,f:v=>vazio(v)?'—':fmtInt(v)+' s'},
                      {k:'ok',r:'Confere',f:v=>v?'sim':'NÃO'}]}
            linhas={lab.casos} destacar={l=>!l.ok}/>
          <div style={{height:10}}/>
          <Tabela legenda="Entradas que devem ser recusadas"
            colunas={[{k:'descricao',r:'Caso',quebra:true},{k:'esperado',r:'Esperado'},{k:'obtido',r:'Obtido'},
                      {k:'detalhe',r:'Motivo devolvido',quebra:true},{k:'ok',r:'Confere',f:v=>v?'sim':'NÃO'}]}
            linhas={lab.rejeicoes} destacar={l=>!l.ok}/>
        </>}
      </Painel>
    );
  };

  const Ingestao = ({sessao}) => {
    const {c,mono} = useTema();
    const base = window.NODEWATCH_API;
    return (
      <Painel titulo="API de ingestão de eventos novos">
        <p style={{fontSize:13,margin:'0 0 8px'}}>Com o processamento iniciado por esta aba, um produtor envia eventos com <code>POST {base}/api/ml/eventos</code> e o cabeçalho <code>X-NodeWatch-Sessao</code> desta sessão. Cada evento tem <code>tipo</code> (<code>transacao</code>, <code>medicao_rede</code> ou <code>vinculo</code>), <code>versao_esquema</code>, <code>origem</code>, <code>modo</code> e <code>dados</code>; o servidor grava o evento no registro durável antes de confirmar. Eventos inválidos voltam com o motivo; fila cheia devolve 429; sem sessão, 403.</p>
        <pre style={{fontFamily:mono,fontSize:11.5,background:c.panelLow,border:`1px solid ${c.borderSoft}`,borderRadius:6,padding:'10px 12px',overflowX:'auto',margin:'0 0 8px'}}>
{`python scripts/produtor_eventos_exemplo.py --sessao ${sessao.id||'<sessão desta aba>'} --tipo financeiro --limite 2000
python scripts/produtor_eventos_exemplo.py --sessao ${sessao.id||'<sessão desta aba>'} --tipo rede --limite 500`}</pre>
        <div style={{fontSize:12,color:c.muted}}>O produtor de exemplo lê arquivos existentes e, por isso, marca os eventos como <strong>replay histórico</strong>. Medições de rede precisam chegar com os atributos <code>rede_v1</code> prontos; telemetria bruta é recusada. Contratos: <a href={`${base}/api/ml/eventos/contratos`} style={{color:c.primary}}>/api/ml/eventos/contratos</a> e <code>docs/ml/EVENTOS.md</code>.</div>
      </Painel>
    );
  };

  const ProcessamentoEventos = ({st, sessao, acao, trabalhando}) => {
    const {c,mono} = useTema();
    const s = st.servico, resp = st.responsavel || {};
    const rec = s.recuperacao || {};
    const pode = sessao.ativa && !trabalhando;
    let situacao, tom, botao = null;
    if(!s.aberto){
      situacao = 'há estado anterior não recuperado; nada foi retomado'; tom = 'aviso';
      botao = ['Recuperar e iniciar','primario'];
    } else if(resp.e_esta_sessao && resp.ativa && s.trabalhador_ativo){
      situacao = 'em execução por esta aba'; tom = 'ok';
    } else if(resp.definida && resp.ativa){
      situacao = 'em execução por outra aba'; tom = 'info'; botao = ['Assumir nesta aba','primario'];
    } else if(resp.definida){
      situacao = 'parado: a sessão responsável expirou ou foi encerrada; os eventos aceitos esperam no registro'; tom = 'aviso';
      botao = ['Retomar nesta aba','primario'];
    } else {
      situacao = 'parado: nada é processado até uma ação desta tela'; tom = 'neutro'; botao = ['Iniciar processamento','primario'];
    }
    const b = s.bloqueio;
    return (
      <Painel titulo="Processamento de eventos" extra={<Selo tom={tom}>{situacao.split(':')[0]}</Selo>}>
        <p style={{fontSize:13,margin:'0 0 10px'}}>{maiuscula(situacao)}.</p>
        {!s.aberto && <Aviso tom="aviso" titulo="Recuperação pendente.">
          {rec.instantaneo ? <>Instantâneo de {fmtData(rec.instantaneo.salvo_em)} UTC ({fmtBytes(rec.instantaneo.bytes)} em disco), cobrindo até o evento {fmtInt(rec.instantaneo.aplicado_ate)}. </> : 'Sem instantâneo. '}
          {fmtInt(rec.eventos_aceitos_nao_aplicados)} eventos aceitos depois dele estão no registro durável e serão reaplicados, sem duplicar: as saídas voltam ao tamanho do instantâneo e são refeitas.
        </Aviso>}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          {botao && <button type="button" disabled={!pode} style={estiloBotao(c,botao[1])} onClick={()=>acao('/eventos/iniciar')}>{botao[0]}</button>}
          {resp.e_esta_sessao && resp.ativa && <button type="button" disabled={!pode} style={estiloBotao(c)} onClick={()=>acao('/eventos/pausar')}>Pausar processamento</button>}
          <span style={{fontSize:12,color:c.muted,fontFamily:mono}}>registro: evento {fmtInt(s.registro && s.registro.ultima_seq)} aceito · {fmtInt(s.registro && s.registro.aplicado_ate)} aplicado</span>
        </div>
        {s.restaurado && s.restaurado.restaurado && <div style={{marginTop:10}}><Aviso tom="ok" titulo="Recuperado:">{s.restaurado.instantaneo ? `instantâneo de ${fmtData(s.restaurado.salvo_em)} UTC` : 'sem instantâneo'} + {fmtInt(s.restaurado.eventos_reaplicados)} eventos reaplicados do registro, em {fmtNum(s.restaurado.segundos,2)} s.</Aviso></div>}
        {b && <div style={{marginTop:10}}>
          <Aviso tom="perigo" titulo="Processamento bloqueado por falha.">
            <div><strong>Causa:</strong> <code style={{overflowWrap:'anywhere'}}>{b.erro}</code></div>
            <div style={{overflowWrap:'anywhere'}}><strong>Evento afetado:</strong> {b.ids.join(', ')} (sequência {b.seqs.join(', ')})</div>
            <div>Esperando depois dele, no mesmo lote: {fmtInt(b.eventos_pendentes_depois)} (além dos que estiverem na fila). Desde {fmtData(b.em)} UTC, nada avança sem uma ação abaixo.</div>
            <div style={{marginTop:4}}>{b.leitura}</div>
          </Aviso>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button type="button" disabled={!pode} style={estiloBotao(c,'primario')} onClick={()=>acao('/eventos/bloqueio/repetir')}>Repetir</button>
            <button type="button" disabled={!pode} style={estiloBotao(c,'perigo')}
              onClick={()=>{ if(window.confirm('Descartar o evento que falhou? Ele não gera previsão, e o descarte fica gravado no registro e na lista de recusas.')) acao('/eventos/bloqueio/descartar'); }}>Descartar evento</button>
          </div>
        </div>}
      </Painel>
    );
  };

  const AreaEventos = ({sessao, onAbrirFonte}) => {
    const {c} = useTema();
    const [intervalo, setIntervalo] = React.useState(2000);
    const {dados:st, erro, tick, recarregar} = useConsultaPeriodica('/eventos/status', intervalo);
    const [trabalhando, setTrabalhando] = React.useState(false);
    const [erroAcao, setErroAcao] = React.useState(null);
    const acao = async (caminho, corpo) => {
      setTrabalhando(true); setErroAcao(null);
      try {
        await apiML(caminho, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corpo||{})});
      } catch(e){ setErroAcao(e); } finally { setTrabalhando(false); recarregar(); }
    };
    const descartar = () => {
      if(window.confirm('Descartar o estado de eventos? Isso para os replays e apaga o instantâneo e os arquivos eventos_*.csv gerados aqui. Modelos e outros arquivos não são tocados.'))
        acao('/eventos/descartar');
    };
    return (
      <div>
        <Aviso tom="info" titulo="Previsões novas, sem treino.">Esta área usa o modelo salvo (carregado uma vez pelo servidor) para pontuar eventos. A rede recebe medições com atributos já preparados; o financeiro mantém um estado por conta e calcula os atributos de cada transação sem reconstruir o histórico. Nenhuma fonte aqui é “ao vivo”: o replay reenvia arquivos existentes.</Aviso>
        <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap',marginBottom:12}}>
          <Campo rotulo="Atualizar status">
            <select value={intervalo} onChange={e=>setIntervalo(+e.target.value)}>
              {INTERVALOS.map(([v,n])=><option key={v} value={v}>{n}</option>)}
            </select>
          </Campo>
          <button type="button" style={estiloBotao(c)} onClick={recarregar}>Atualizar agora</button>
          <button type="button" style={estiloBotao(c)} disabled={trabalhando||!sessao.ativa} onClick={()=>{ if(window.confirm('Fechar à força todos os minutos abertos? Transações desses minutos que chegarem depois serão recusadas como atrasadas.')) acao('/eventos/fechar'); }}
                  title="Fecha os minutos financeiros ainda abertos e pontua as transações deles">Fechar minutos abertos</button>
          <button type="button" style={estiloBotao(c)} disabled={trabalhando||!sessao.ativa} onClick={()=>acao('/eventos/salvar')}>Gravar estado agora</button>
          <button type="button" style={estiloBotao(c,'perigo')} disabled={trabalhando||!sessao.ativa} onClick={descartar}>Descartar estado</button>
        </div>
        <BarraSessao sessao={sessao}/>
        <CaixaErro erro={erro || erroAcao}/>
        {!st && !erro && <Carregando texto="Carregando o modelo (alguns segundos na primeira vez; nenhum processamento começa sozinho)…"/>}
        {st && <>
          <ProcessamentoEventos st={st} sessao={sessao} acao={acao} trabalhando={trabalhando}/>
          <Painel titulo="Status do processamento"><StatusEventos st={st} ocupado={st.servico.ocupado}/></Painel>
          <Painel titulo="Replay histórico" extra={<Selo tom="info">arquivos existentes · não é fonte ao vivo</Selo>}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,340px),1fr))',gap:12}}>
              {['rede','financeiro'].map(f=>(
                <ControleReplay key={f} fonte={f} arquivo={st.fontes_replay[f]} replay={st.replays[f]}
                                historico={st.historico_financeiro} velocidades={st.velocidades} trabalhando={trabalhando||!sessao.ativa}
                                onAcao={corpo=>acao('/eventos/replay', corpo)}/>))}
            </div>
          </Painel>
          {st.servico.saidas && st.servico.saidas.length>0 && <Painel titulo="Arquivos gerados">
            <Tabela colunas={[{k:'arquivo',r:'Arquivo',mono:true},{k:'dominio',r:'Domínio'},{k:'modo',r:'Modo',f:v=>ROTULO_MODO[v]||v},
                              {k:'linhas',r:'Previsões',num:true,f:fmtInt},
                              {k:'id',r:'Ação',f:(v,l)=><button type="button" style={{...estiloBotao(c,'primario'),padding:'3px 10px'}} onClick={()=>onAbrirFonte(l.dominio, v)}>Abrir na análise</button>}]}
                    linhas={st.servico.saidas}/>
          </Painel>}
          <Recentes tick={tick}/>
          <PrevisaoCSV sessao={sessao} onAbrirFonte={onAbrirFonte}/>
          <Fusao st={st} sessao={sessao}/>
          <Ingestao sessao={sessao}/>
        </>}
      </div>
    );
  };

  /* ── Analisar dataset: dados novos + modelo salvo (nada é treinado) ─────────
     Selecionar só valida. Quem gera previsões é a ação "Analisar dataset", com sessão ativa.
     Filtros e tabelas dos resultados usam a exploração, sem nova inferência. */
  const SITUACAO_ANALISE = {
    pronta:['validado, aguardando Analisar dataset','info'], executando:['analisando','info'], pausando:['pausando no próximo bloco','aviso'],
    pausada:['pausada','aviso'], cancelando:['cancelando no próximo bloco','aviso'], cancelada:['cancelada','aviso'],
    concluida:['concluída','ok'], interrompida:['interrompida','aviso'], erro:['erro','perigo'], invalida:['não analisável','perigo'],
  };
  const fmtPeriodo = p => p ? `${fmtData(p[0])} a ${fmtData(p[1])} UTC` : '—';

  const FormatosAceitos = ({dados}) => {
    const {c,mono} = useTema();
    if(!dados) return null;
    return (
      <Painel titulo="Formatos aceitos">
        <p style={{fontSize:13,margin:'0 0 10px'}}>Vale qualquer arquivo que cumpra um destes contratos, seja qual for o nome, o período, as contas ou o tamanho (até {fmtBytes(dados.limites.bytes)} por arquivo; {fmtBytes(dados.limites.historico_bytes)} no histórico). O arquivo inteiro é analisado, em blocos de {fmtInt(dados.limites.bloco_linhas)} linhas; nada é amostrado.</p>
        {Object.entries(dados.formatos).map(([id,f])=>(
          <details key={id} style={{marginBottom:8,fontSize:12.5}}>
            <summary style={{cursor:'pointer',color:c.primary}}><strong>{f.nome}</strong> <code>{id}</code></summary>
            <pre style={{fontFamily:mono,fontSize:11,background:c.panelLow,border:`1px solid ${c.borderSoft}`,borderRadius:6,padding:'8px 10px',overflowX:'auto',margin:'6px 0'}}>{f.cabecalho}</pre>
            <div style={{color:c.muted}}>Rótulo: {f.rotulo}. Sem rótulo a inferência funciona, e as métricas supervisionadas ficam indisponíveis.</div>
            <ul style={{margin:'4px 0 0 18px',color:c.muted}}>{f.regras.map((r,i)=><li key={i}>{r}</li>)}</ul>
          </details>))}
        <div style={{fontSize:12,color:c.muted,marginTop:8}}><strong>Reconhecidos, mas não analisáveis aqui:</strong>
          <ul style={{margin:'4px 0 0 18px'}}>{Object.entries(dados.nao_analisaveis).map(([k,v])=><li key={k}><code>{k}</code>: {v}</li>)}</ul>
        </div>
      </Painel>
    );
  };

  const SelecionarDataset = ({sessao, onCriada}) => {
    const {c} = useTema();
    const [arquivo, setArquivo] = React.useState(null);
    const [historico, setHistorico] = React.useState(null);
    const [enviando, setEnviando] = React.useState(false);
    const [erro, setErro] = React.useState(null);
    const [recusado, setRecusado] = React.useState(null);
    const enviar = async ev => {
      ev.preventDefault();
      setEnviando(true); setErro(null); setRecusado(null);
      try {
        const fd = new FormData();
        fd.append('arquivo', arquivo);
        if(historico) fd.append('historico', historico);
        const m = await apiML('/analises', {method:'POST', body:fd});
        if(m.situacao==='invalida') setRecusado(m);
        // Limpa a seleção: o histórico de uma análise não pode ir junto na próxima sem o usuário pedir.
        ev.target.reset(); setArquivo(null); setHistorico(null);
        onCriada(m);
      } catch(e){ setErro(e); } finally { setEnviando(false); }
    };
    const d = recusado && recusado.deteccao;
    return (
      <Painel titulo="Selecionar dataset novo">
        <form onSubmit={enviar} style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
          <Campo rotulo="Dataset (CSV ou ZIP com um CSV)"><input type="file" accept=".csv,.zip,text/csv" onChange={e=>setArquivo(e.target.files[0]||null)}/></Campo>
          <Campo rotulo="Histórico anterior (opcional, só financeiro)"
                 dica="Só o que for anterior ao 1º minuto do dataset é usado. Sem ele, as contas começam sem passado."><input type="file" accept=".csv,.zip,text/csv" onChange={e=>setHistorico(e.target.files[0]||null)}/></Campo>
          <button type="submit" disabled={!arquivo||enviando||!sessao.ativa} style={{...estiloBotao(c,'primario'),opacity:!arquivo||enviando||!sessao.ativa?0.5:1}}>
            {enviando ? 'Enviando e validando…' : 'Validar arquivo'}</button>
        </form>
        <div style={{fontSize:12,color:c.muted,marginTop:8}}>Validar não gera previsões: confere formato, colunas, tipos, datas, valores e moedas.</div>
        <div style={{marginTop:10}}><CaixaErro erro={erro}/></div>
        {d && <Aviso tom="aviso" titulo={`${recusado.dataset.nome}: não dá para analisar aqui.`}>
          {d.leitura}
          {d.possiveis && d.possiveis.length>0 && <div style={{marginTop:4}}><strong>Possível:</strong> {d.possiveis.join('; ')}.</div>}
          {Object.entries(d.faltando||{}).map(([k,v])=>v.length>0 && <div key={k} style={{marginTop:4,overflowWrap:'anywhere'}}><strong>Falta para {k}:</strong> {v.slice(0,14).join(', ')}{v.length>14?` … (${v.length} no total)`:''}</div>)}
          <div style={{marginTop:4}}>Nada foi preenchido nem inventado.</div>
        </Aviso>}
      </Painel>
    );
  };

  const CartaoAnalise = ({a, sessao, onAcao, onAbrirFonte, trabalhando}) => {
    const {c,mono} = useTema();
    const [txt, tom] = SITUACAO_ANALISE[a.situacao] || [a.situacao,'neutro'];
    const p = a.progresso || {};
    const ativa = ['executando','pausando','cancelando'].includes(a.situacao);
    const pode = sessao.ativa && !trabalhando;
    const parcial = a.situacao!=='concluida' && (p.processadas||0)>0;
    const dominio = a.deteccao && a.deteccao.dominio;
    const ind = a.dominio_indicadores || {};
    const av = a.avaliacao;
    const dona = ativa ? (a.e_desta_sessao ? 'esta aba' : a.sessao_dona_ativa ? 'outra aba' : 'sessão inativa; para no próximo bloco') : null;
    const retomar = ['pausada','interrompida','erro'].includes(a.situacao);
    return (
      <div style={{border:`1px solid ${c.borderSoft}`,borderRadius:8,padding:'12px 14px',marginBottom:12,minWidth:0}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:6}}>
          <strong style={{fontSize:14,overflowWrap:'anywhere'}}>{a.dataset.nome}</strong>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            <Selo tom={tom}>{txt}</Selo>
            {parcial && <Selo tom="aviso" title="Não é o resultado do arquivo inteiro">resultado parcial</Selo>}
          </div>
        </div>
        <div style={{fontSize:12,color:c.muted,lineHeight:1.6,overflowWrap:'anywhere'}}>
          <code>{a.deteccao.formato}</code> · {fmtBytes(a.dataset.bytes)} · sha256 <span style={{fontFamily:mono}}>{a.dataset.sha256.slice(0,12)}…</span> · análise <span style={{fontFamily:mono}}>{a.id}</span>
          {a.resumo && <> · período {fmtPeriodo(a.resumo.periodo_utc)}{a.resumo.contas!==undefined && <> · {fmtInt(a.resumo.contas)} contas</>}{a.resumo.fluxos!==undefined && <> · {fmtInt(a.resumo.fluxos)} fluxos</>} · {a.resumo.rotulos?'com rótulos':'sem rótulos'}</>}
          {a.modelo_usado && <> · modelo <span style={{fontFamily:mono}}>{a.modelo_usado.versao}</span>, limiar {fmtNum(a.modelo_usado.limiar,4)}</>}
          {a.inicio_utc && <> · início {fmtData(a.inicio_utc)} UTC</>}{a.fim_utc && <> · fim {fmtData(a.fim_utc)} UTC</>}
          {dona && <> · responsável: {dona}</>}
        </div>
        {a.motivo && <div style={{fontSize:12.5,marginTop:6,color:a.situacao==='erro'?c.danger:c.amber}}>{a.motivo}</div>}
        <div style={{marginTop:8}}>
          <BarraProgresso fracao={p.validas ? (p.processadas||0)/p.validas : 0}
            rotulo={`${fmtInt(p.lidas)} lidas · ${fmtInt(p.validas)} válidas · ${fmtInt(p.recusadas)} recusadas · ${fmtInt(p.processadas)} processadas`}/>
        </div>
        {a.recusas && Object.keys(a.recusas).length>0 &&
          <details style={{fontSize:12,marginTop:6}}>
            <summary style={{cursor:'pointer',color:c.amber}}>Linhas recusadas: {fmtInt(p.recusadas)}</summary>
            <ul style={{margin:'4px 0 0 18px'}}>{Object.entries(a.recusas).map(([m,n])=><li key={m}>{m}: {fmtInt(n)}</li>)}</ul>
            {a.exemplos_recusa && a.exemplos_recusa.length>0 && <div style={{color:c.muted,marginTop:4}}>Exemplos: {a.exemplos_recusa.slice(0,6).map(e=>`linha ${e.linha} (${e.motivo})`).join('; ')}.</div>}
          </details>}
        {a.historico && <div style={{fontSize:12,color:c.muted,marginTop:6}}>Histórico: {a.historico.nome}
          {a.historico.cobertura ? <> · {fmtInt(a.historico.cobertura.transacoes)} transações usadas, de {fmtData(a.historico.cobertura.inicio_utc)} a {fmtData(a.historico.cobertura.fim_utc)} UTC; {fmtInt(a.historico.ignoradas_no_periodo)} ignoradas por não serem anteriores ao dataset</> : a.historico.aviso ? <> · {a.historico.aviso}</> : <> · será aplicado ao iniciar</>}.</div>}
        {dominio==='lavagem' && !a.historico && <Aviso tom="aviso" titulo="Sem histórico anterior:">as contas começam sem passado e os atributos de contagem ficam subestimados, o que costuma reduzir muito scores e alertas nas primeiras 72 h. Num teste com um dia do HI-Small, foram 1 alerta sem histórico e 203 com dois dias de histórico (docs/ml/ANALISE_DATASETS.md). Se tiver transações anteriores, informe-as.</Aviso>}
        {(ind.moedas_fora_do_treino||[]).length>0 && <Aviso tom="aviso" titulo="Moedas fora do treino:">{ind.moedas_fora_do_treino.join(', ')}. Sem taxa de câmbio aprendida em {fmtPct(ind.fracao_sem_taxa_de_cambio)} das linhas: o valor em USD fica ausente, com indicador, sem inventar taxa.</Aviso>}
        {(ind.formatos_fora_do_treino||[]).length>0 && <Aviso tom="aviso" titulo="Formatos fora do treino:">{ind.formatos_fora_do_treino.join(', ')}.</Aviso>}
        {ind.acima_do_p99_do_treino && <div style={{fontSize:12,color:c.muted,marginTop:6}}>
          <strong>Comparação com o treino</strong> (fração acima do p99; no treino, cerca de 1%): {Object.entries(ind.acima_do_p99_do_treino).map(([k,v])=>`${k} ${fmtPct(v.fracao)}`).join(' · ')} · histórico incompleto em {fmtPct(ind.fracao_historico_incompleto)} das linhas. Compatibilidade de formato não garante o mesmo desempenho em outra população.</div>}
        {ind.psi && <div style={{fontSize:12,color:c.muted,marginTop:6}}><strong>Deriva (PSI ≥ 0,25):</strong> {(ind.psi_acima_0_25||[]).join(', ') || 'nenhuma coluna'}. {ind.leitura}</div>}
        {av && !av.disponivel && <div style={{fontSize:12.5,marginTop:6}}><strong>Métricas supervisionadas:</strong> indisponíveis. {maiuscula(av.motivo)}.</div>}
        {av && av.disponivel && <div style={{marginTop:8}}>
          <GradeKpi min={130}>
            {'precisao' in av && <Kpi rotulo="Precisão" valor={fmtPct(av.precisao)} sub={`${fmtInt(av.alertas)} alertas`}/>}
            {'recall' in av && <Kpi rotulo="Recall" valor={fmtPct(av.recall)} sub={`${fmtInt(av.positivos)} positivos`}/>}
            {'average_precision' in av && <Kpi rotulo="Average precision" valor={fmtNum(av.average_precision,3)}/>}
            {'macro_f1' in av && <Kpi rotulo="Macro-F1" valor={fmtNum(av.macro_f1,3)}/>}
            {'acuracia' in av && <Kpi rotulo="Acurácia" valor={fmtPct(av.acuracia)}/>}
            {'precisao_alerta' in av && <Kpi rotulo="Precisão do alerta" valor={fmtPct(av.precisao_alerta)}/>}
            {'recall_alerta' in av && <Kpi rotulo="Recall do alerta" valor={fmtPct(av.recall_alerta)}/>}
          </GradeKpi>
          <div style={{fontSize:12,color:c.muted}}>{av.leitura}</div>
        </div>}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:10}}>
          {a.situacao==='pronta' && <button type="button" disabled={!pode} style={estiloBotao(c,'primario')} onClick={()=>onAcao(a.id,'iniciar')}>Analisar dataset</button>}
          {retomar && <button type="button" disabled={!pode} style={estiloBotao(c,'primario')} onClick={()=>onAcao(a.id,'retomar')}>{a.situacao==='erro'?'Tentar de novo do último checkpoint':'Retomar análise'}</button>}
          {a.situacao==='executando' && <button type="button" disabled={!pode} style={estiloBotao(c)} onClick={()=>onAcao(a.id,'pausar')}>Pausar</button>}
          {(a.situacao==='executando' || a.situacao==='pronta' || retomar) && <button type="button" disabled={!pode} style={estiloBotao(c,'perigo')}
              onClick={()=>{ if(window.confirm('Cancelar esta análise? O que já foi gravado fica como resultado parcial; ela não poderá ser retomada.')) onAcao(a.id,'cancelar'); }}>Cancelar</button>}
          {a.fonte_id && !ativa && <button type="button" style={estiloBotao(c,'primario')} onClick={()=>onAbrirFonte(dominio, a.fonte_id)}>Abrir resultados</button>}
          {a.fonte_id && !ativa && <a href={`${ML_API}/fontes/${caminhoFonte(a.fonte_id)}/exportar`} style={{...estiloBotao(c),textDecoration:'none'}}>Exportar CSV</a>}
        </div>
      </div>
    );
  };

  const AreaAnalisar = ({sessao, onAbrirFonte}) => {
    const {c} = useTema();
    const {dados, erro, recarregar} = useConsultaPeriodica('/analises', 2000);
    const [erroAcao, setErroAcao] = React.useState(null);
    const [trabalhando, setTrabalhando] = React.useState(false);
    const acao = async (id, nome) => {
      setTrabalhando(true); setErroAcao(null);
      try { await apiML(`/analises/${id}/${nome}`, {method:'POST'}); }
      catch(e){ setErroAcao(e); } finally { setTrabalhando(false); recarregar(); }
    };
    const lista = dados ? dados.analises.filter(a=>a.situacao!=='invalida') : [];
    const paradas = lista.filter(a=>['pausada','interrompida'].includes(a.situacao));
    return (
      <div>
        <Aviso tom="info" titulo="Analisar novo dataset gera previsões novas com o modelo salvo.">Nada é treinado nem reajustado: câmbio, categorias, limiar e modelo são os do treino. Cada análise tem identidade e estado próprios. Para abrir um CSV de previsões já calculadas, use “Importar” nas áreas de análise (explorar previsões existentes).</Aviso>
        <BarraSessao sessao={sessao}/>
        <CaixaErro erro={erro || erroAcao}/>
        {paradas.length>0 && <Aviso tom="aviso" titulo="Execução anterior parada.">{paradas.length===1?'Há 1 análise':`Há ${paradas.length} análises`} sem terminar. Nada recomeça sozinho: use “Retomar análise” abaixo, se quiser continuar.</Aviso>}
        <SelecionarDataset sessao={sessao} onCriada={recarregar}/>
        <Painel titulo="Análises">
          {!dados && !erro && <Carregando/>}
          {dados && lista.length===0 && <SemDados texto="Nenhuma análise ainda. Selecione um dataset acima."/>}
          {lista.map(a=><CartaoAnalise key={a.id} a={a} sessao={sessao} onAcao={acao} onAbrirFonte={onAbrirFonte} trabalhando={trabalhando}/>)}
          {dados && lista.length>0 && <div style={{fontSize:12,color:c.muted}}>{dados.politica_sessao.leitura} Pausa, cancelamento e expiração valem no fim do bloco em andamento. Outra aba pode pausar ou cancelar; retomar transfere a responsabilidade para a aba que retomou. Uma análise roda por vez.</div>}
        </Painel>
        <FormatosAceitos dados={dados}/>
      </div>
    );
  };

  /* ── Seção completa ────────────────────────────────────────────── */
  const AREAS_ML = [['visao','Visão geral','#ml'],['rede','Análise de rede','#ml/rede'],
                    ['financeiro','Análise financeira','#ml/financeiro'],['avaliacao','Avaliação dos modelos','#ml/avaliacao'],
                    ['analisar','Analisar dataset','#ml/analisar'],['eventos','Eventos','#ml/eventos']];
  const PREFERIDA = {rede:'app:artefatos_ml/exemplos/previsoes_rede_exemplo.csv', lavagem:'app:artefatos_ml/exemplos/previsoes_lavagem_exemplo.csv'};

  const SecaoML = ({area, sessao}) => {
    const {c} = useTema();
    const [status, setStatus] = React.useState(null);
    const [erroStatus, setErroStatus] = React.useState(null);
    const [fontes, setFontes] = React.useState(null);
    const [erroFontes, setErroFontes] = React.useState(null);
    const [selecao, setSelecao] = React.useState({rede:null, lavagem:null});
    const [filtros, setFiltros] = React.useState({rede:{...FILTROS_VAZIOS.rede}, lavagem:{...FILTROS_VAZIOS.lavagem}});
    const [avaliacao, setAvaliacao] = React.useState(null);
    const [erroAvaliacao, setErroAvaliacao] = React.useState(null);

          <span style={{fontSize:13,color:c.muted}}>previsões e avaliações produzidas por <code>src/ml</code> · exploração somente leitura · Analisar dataset e Eventos geram previsões novas sem treinar · funciona sem chave do Gemini</span>
        </div>

            <a key={id} href={href} aria-current={area===id?'page':undefined}
               style={{padding:'9px 14px',fontSize:13,textDecoration:'none',fontWeight:area===id?600:500,
                       color:area===id?c.primary:c.muted,borderBottom:`2px solid ${area===id?c.primary:'transparent'}`,marginBottom:-1}}>{nome}</a>
          ))}

        {area==='rede' && <AreaAnalise key="rede" dominio="rede" fontes={fontes} fonteId={selecao.rede} setFonteId={id=>trocarFonte('rede',id)}
                              descricao={descRede} aplicados={filtros.rede} setAplicados={v=>setFiltros(f=>({...f,rede:v}))}
                              onImportar={importar} onRemover={remover} limites={limites}/>}
        {area==='financeiro' && <AreaAnalise key="lavagem" dominio="lavagem" fontes={fontes} fonteId={selecao.lavagem} setFonteId={id=>trocarFonte('lavagem',id)}
                              descricao={descLav} aplicados={filtros.lavagem} setAplicados={v=>setFiltros(f=>({...f,lavagem:v}))}
                              onImportar={importar} onRemover={remover} limites={limites}/>}
        {area==='avaliacao' && <AvaliacaoModelos avaliacao={avaliacao} erro={erroAvaliacao} selecao={selecao} filtros={filtros} descricoes={descricoes}/>}
        {area==='analisar' && <AreaAnalisar sessao={sessao} onAbrirFonte={abrirFonte}/>}
        {area==='eventos' && <AreaEventos sessao={sessao} onAbrirFonte={abrirFonte}/>}
        <div style={{marginTop:24,paddingTop:16,borderTop:`1px solid ${c.borderSoft}`,fontSize:11.5,color:c.faint,display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
          <span>NodeWatch · Machine Learning · dados de rede (dataset_final.csv) e IBM AML HI-Small (sintético) — modelos independentes</span>
          <span>API local: {window.NODEWATCH_API}/api/ml</span>
        </div>
      </div>
    );
  };
  /* Um erro de renderização numa área não apaga o painel inteiro. */
  class LimiteErroML extends React.Component {
    constructor(p){ super(p); this.state = {erro:null}; }
    static getDerivedStateFromError(erro){ return {erro}; }
    componentDidUpdate(anterior){ if(anterior.area!==this.props.area && this.state.erro) this.setState({erro:null}); }
    render(){
      if(!this.state.erro) return this.props.children;
      return (
        <div style={{padding:'20px 28px'}}>
          <CaixaErro erro={{erro:'falha ao exibir esta área', problemas:[String(this.state.erro && this.state.erro.message)],
                            acao:'Volte para outra área do menu ou recarregue a página. Os dados e modelos não foram alterados.'}}/>
        </div>
      );
    }
  }
  // Usado pelo bloco 4 (scripts clássicos compartilham o escopo global).
  // Não atribua a window.SecaoML: o Babel converte const em var global e a atribuição

  const SecaoMLProtegida = props => <LimiteErroML area={props.area}><SecaoML {...props}/></LimiteErroML>;

  <script type="text/babel">

  /* ── GraphView ─────────────────────────────────────────────────── */
  const GraphView = ({data, layout, colors:c, activeCycle, showAmounts}) => {
    const pos =
      layout==='hierarchical' ? data.positionsHierarchical :
      layout==='circular'     ? data.positionsCircular :
      data.positions;

    const mono = '"JetBrains Mono", monospace';

    const cycleEdgeSet = React.useMemo(()=>{
      const s=new Set();
      data.cycles.forEach((cy,ci)=>cy.edges.forEach(e=>s.add(`${e.src}->${e.dst}#${ci}`)));
      return s;
    },[data]);

    const cycleVertexSet = React.useMemo(()=>{
      const s=new Set();
      data.cycles.forEach(cy=>cy.path.forEach(v=>s.add(v)));
      return s;
    },[data]);

    const isInCycle=(src,dst)=>{
      for(let ci=0;ci<data.cycles.length;ci++)
        if(cycleEdgeSet.has(`${src}->${dst}#${ci}`)) return ci;
      return -1;
    };

    /* curva quadrática; labelT desloca o ponto do pill ao longo da curva */
    const buildEdge=(a,b,dir=1,labelT=0.5)=>{
      const dx=b.x-a.x, dy=b.y-a.y;
      const len=Math.sqrt(dx*dx+dy*dy)||1;
      const r=22, ux=dx/len, uy=dy/len;
      const sx=a.x+ux*r, sy=a.y+uy*r;
      const ex=b.x-ux*r, ey=b.y-uy*r;
      const mx=(sx+ex)/2, my=(sy+ey)/2;
      const cpx=mx-uy*28*dir, cpy=my+ux*28*dir;
      const t=labelT;
      const lx=(1-t)*(1-t)*sx+2*(1-t)*t*cpx+t*t*ex;
      const ly=(1-t)*(1-t)*sy+2*(1-t)*t*cpy+t*t*ey;
      return {d:`M ${sx} ${sy} Q ${cpx} ${cpy} ${ex} ${ey}`, mid:{x:lx,y:ly}};
    };

    const edgeIdx={}, labelCountMap={};
    const edges=data.transactions.map((t,i)=>{
      const a=pos[t.src], b=pos[t.dst];
      if(!a||!b) return null;
      const k=`${t.src}-${t.dst}`;
      edgeIdx[k]=(edgeIdx[k]||0)+1;
      const dir=edgeIdx[k]%2===0?-1:1;
      const ci=isInCycle(t.src,t.dst);
      const inCycle=ci>=0;
      const isActive=activeCycle==null||ci===activeCycle;
      /* deslocar label ao longo da curva para evitar sobreposição */
      let labelT=0.5;
      if(inCycle){
        const n=(labelCountMap[k]||0);
        labelT = n===0 ? 0.38 : n===1 ? 0.62 : 0.5;
        labelCountMap[k]=n+1;
      }
      const {d,mid}=buildEdge(a,b,dir,labelT);
      return {id:i,d,mid,inCycle,isActive,ci,amount:t.amount};
    }).filter(Boolean);

    return (
      <svg viewBox="0 0 800 500" width="100%" height="100%"
           style={{display:'block',overflow:'visible'}}>
        <defs>
          <marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0 0L10 5L0 10z" fill={c.muted} opacity="0.5"/>
          </marker>
          <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0L10 5L0 10z" fill={c.danger}/>
          </marker>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        {edges.filter(e=>e.inCycle&&e.isActive).map(e=>
          <path key={`h${e.id}`} d={e.d} fill="none"
                stroke={c.danger} strokeWidth="10" strokeOpacity="0.13" strokeLinecap="round"/>
        )}
        {edges.filter(e=>!e.inCycle).map(e=>
          <path key={`n${e.id}`} d={e.d} fill="none"
                stroke={c.muted} strokeWidth="1.25"
                strokeOpacity={activeCycle!=null?0.15:0.35}
                markerEnd="url(#arr-n)"/>
        )}
        {edges.filter(e=>e.inCycle).map(e=>
          <g key={`c${e.id}`} opacity={e.isActive?1:0.2}>
            <path d={e.d} fill="none" stroke={c.danger}
                  strokeWidth="2.25" markerEnd="url(#arr-c)"/>
            {showAmounts&&(
              <g>
                <rect x={e.mid.x-32} y={e.mid.y-11} width="64" height="22" rx="11"
                      fill={c.panel} stroke={c.danger} strokeWidth="1"/>
                <text x={e.mid.x} y={e.mid.y+5}
                      fill={c.danger} fontSize="10" fontWeight="700"
                      textAnchor="middle" style={{fontFamily:mono}}>
                  {e.amount>=1000
                    ?`R$${(e.amount/1000).toFixed(1)}k`
                    :`R$${e.amount.toFixed(0)}`}
                </text>
              </g>
            )}
          </g>
        )}
        {data.vertices.map(v=>{
          const p=pos[v]; if(!p) return null;
          const inC=cycleVertexSet.has(v);
          return (
            <g key={v}>
              {inC&&<circle cx={p.x} cy={p.y} r="26"
                             fill={c.danger} opacity="0.12" filter="url(#glow)"/>}
              <circle cx={p.x} cy={p.y} r="22"
                      fill={inC?c.dangerBg:c.panel}
                      stroke={inC?c.danger:c.muted}
                      strokeWidth={inC?2:1.25}
                      strokeOpacity={inC?1:0.55}/>
              <text x={p.x} y={p.y+4}
                    fill={inC?c.danger:c.text}
                    fontSize="11" fontWeight={inC?700:500}
                    textAnchor="middle"
                    style={{fontFamily:mono,pointerEvents:'none'}}>{v}</text>
            </g>
          );
        })}
      </svg>
    );
  };

      const handler = () => {
        try { setHist(JSON.parse(localStorage.getItem('nodewatch_historico')||'[]')); }
        catch(e){}
      };
      window.addEventListener('storage', handler);
      const interval = setInterval(()=>{
        try {
          const novo = JSON.parse(localStorage.getItem('nodewatch_historico')||'[]');
          setHist(prev => JSON.stringify(prev)!==JSON.stringify(novo) ? novo : prev);
        } catch(e){}
      }, 2000);
      return () => { window.removeEventListener('storage', handler); clearInterval(interval); };
    }, []);

                        SCC #{scc.id}
                      </span>
                      <span style={pill('danger')}>{scc.size} contas</span>
                    </div>
                    <div style={{fontSize:12,color:c.muted,marginBottom:6}}>
                      Contas: <span style={{color:c.text,fontFamily:mono}}>{scc.vertices.join(', ')}</span>
                    </div>
                    <div style={{display:'flex',gap:16,fontSize:12,color:c.muted}}>
                      <span>Volume: <span style={{color:c.danger,fontFamily:mono,fontWeight:500}}>{fmtBRLshort(scc.volume)}</span></span>
                      <span>Arestas: <span style={{color:c.text,fontFamily:mono}}>{scc.edges}</span></span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </details>

          {/* Centralidade de Grau (colapsável) */}
          <details style={{background:c.panel,border:`1px solid ${c.border}`,
                           borderRadius:10,marginBottom:12,overflow:'hidden'}}>
            <summary style={{padding:'14px 20px',cursor:'pointer',
                             display:'flex',alignItems:'center',
                             justifyContent:'space-between',userSelect:'none'}}>
              <div style={{fontSize:12,fontWeight:600,letterSpacing:'0.08em',
                           textTransform:'uppercase',color:c.text,
                           display:'flex',alignItems:'center',gap:10}}>
                <span style={{color:c.muted}}>▸</span>
                Centralidade de Grau
              </div>
              <span style={{fontSize:12,color:c.muted,fontFamily:mono}}>
                Top {Math.min(10,data.centrality.length)} contas
              </span>
            </summary>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead><tr>
                {['Conta','In','Out','Total','Ciclos','Score','Tipo'].map(h=>(
                  <th key={h} style={{textAlign:'left',padding:'10px 16px',
                                       borderBottom:`1px solid ${c.border}`,
                                       fontWeight:600,color:c.muted,fontSize:11,
                                       letterSpacing:'0.08em',textTransform:'uppercase',
                                       background:c.panelLow}}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {data.centrality.slice(0,10).map((a,i)=>{
                  const scoreColor = a.riskScore>=50?c.danger:a.riskScore>=15?c.amber:c.success;
                  return (
                    <tr key={a.id} style={{background:i%2===1?c.panelLow:'transparent'}}>
                      <td style={{padding:'10px 16px',fontFamily:mono,fontSize:12,fontWeight:500,
                                  color:a.cycleCount>0?c.danger:c.text}}>{a.id}</td>
                      <td style={{padding:'10px 16px',fontFamily:mono,textAlign:'center'}}>{a.inDeg}</td>
                      <td style={{padding:'10px 16px',fontFamily:mono,textAlign:'center'}}>{a.outDeg}</td>
                      <td style={{padding:'10px 16px',fontFamily:mono,textAlign:'center'}}>{a.degree}</td>
                      <td style={{padding:'10px 16px',fontFamily:mono,textAlign:'center'}}>{a.cycleCount}</td>
                      <td style={{padding:'10px 16px'}}>
                        <span style={{fontFamily:mono,fontWeight:600,color:scoreColor}}>{a.riskScore}</span>
                      </td>
                      <td style={{padding:'10px 16px'}}>
                        <span style={{...pill(a.hubType==='SUSPEITO'?'danger':a.hubType==='COLETOR'?'amber':'primary'),
                                      fontSize:10,padding:'2px 8px'}}>
                          {a.hubType}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </details>

          {/* LOG (colapsável) */}
          <details style={{background:c.panel,border:`1px solid ${c.border}`,
                           borderRadius:10,marginBottom:12,overflow:'hidden'}}>
            <summary style={{padding:'14px 20px',cursor:'pointer',
                             display:'flex',alignItems:'center',
                             justifyContent:'space-between',userSelect:'none'}}>
              <div style={{fontSize:12,fontWeight:600,letterSpacing:'0.08em',
                           textTransform:'uppercase',color:c.text,
                           display:'flex',alignItems:'center',gap:10}}>
                <span style={{color:c.muted}}>▸</span>
                Log de execução
              </div>
              <span style={{fontSize:12,color:c.muted,fontFamily:mono}}>DFS + SCC + Centralidade</span>
            </summary>
            <div style={{padding:'16px 24px 20px',fontFamily:mono,fontSize:12.5,lineHeight:1.8,color:c.muted}}>
              {[
                ['14:32:08','OK', 'CSV carregado · 16 linhas',                               c.success],
                ['14:32:08','OK', 'Grafo construído · V=15, E=16',                           c.success],
                ['14:32:08','··', 'Iniciando DFS',                                           c.primary],
                ['14:32:08','!!', 'Ciclo encontrado · C001 → C002 → C003 → C001',           c.danger],
                ['14:32:08','!!', 'Ciclo encontrado · C006 → C007 → C008 → C006',           c.danger],
                ['14:32:08','!!', 'Ciclo encontrado · C011 → C012 → C013 → C014 → C011',   c.danger],
                ['14:32:08','OK', 'DFS completo · 3 ciclos detectados',                      c.success],
                ['14:32:08','··', 'Iniciando Centralidade de Grau',                          c.primary],
                ['14:32:08','OK', '15 contas analisadas · 10 suspeitas',                     c.success],
                ['14:32:08','··', 'Iniciando SCC (Kosaraju)',                                c.primary],
                ['14:32:08','OK', '3 SCCs suspeitos detectados',                             c.success],
              ].map(([ts,lvl,msg,col],i)=>(
                <div key={i} style={{display:'flex',gap:12}}>
                  <span style={{color:c.faint,width:80}}>{ts}</span>
                  <span style={{color:col,width:30,fontWeight:700}}>{lvl}</span>
                  <span style={{color:c.text}}>{msg}</span>
                </div>
              ))}
            </div>
          </details>

          {/* HISTÓRICO DE ANÁLISES SALVAS */}
          <HistoricoPanel c={c} mono={mono} sans={sans} fmtBRLshort={fmtBRLshort}/>

          {/* FOOTER */}
          <div style={{marginTop:24,paddingTop:16,
                       borderTop:`1px solid ${c.borderSoft}`,
                       fontSize:11.5,color:c.faint,fontFamily:mono,
                       display:'flex',justifyContent:'space-between'}}>
            <span>NodeWatch · Detecção de Fraudes em Transações Financeiras · Grupo 4 · Teoria dos Grafos</span>
            <span>DFS + SCC (Kosaraju) + Centralidade · O(V+E)</span>
          </div>
        </div>

        {/* SENTINEL AI CHAT */}
        <SentinelChat data={data} activeCycle={activeCycle} colors={c}/>
        </>)}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Dashboard));
  </script>
</body>
</html>
