  <g font-size="9.5">
    <text x="16" y="158">/api/chat</text><text x="150" y="158">/api/ml · api_ml.py (só leitura)</text><text x="372" y="158">/api/ml/eventos, /analises, /sessao, /prever · api_eventos.py</text>
