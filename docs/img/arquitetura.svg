  <text x="16" y="382" font-size="9">Saída: modelo_unificado.joblib e resultados JSON.</text>
  <text x="16" y="397" font-size="9">Nenhuma tela nem rota da API treina ou reajusta.</text>
  <rect x="380" y="398" width="294" height="64" rx="5" fill="#f3f4f6" stroke="#8a919c"/>
  <text x="527" y="415" text-anchor="middle" font-size="10" font-weight="600">Disco: artefatos_ml/</text>
