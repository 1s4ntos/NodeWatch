  <text x="527" y="347" text-anchor="middle" font-size="9">previsao.py + modelos.py: pontuação com o artefato salvo</text>
  <text x="527" y="360" text-anchor="middle" font-size="9">integracao.py: sinal de rede vinculado (fusão indisponível)</text>
  <path d="M527,368 L527,396" stroke="#4a5260" stroke-width="1.2" marker-end="url(#s1)" fill="none"/>

  <rect x="6" y="332" width="360" height="130" rx="6" fill="#fdf5e6" stroke="#a2650a"/>
