<svg viewBox="0 0 680 266" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="s3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#4a5260"/></marker></defs>
  <g font-size="9.3">
    <rect x="4" y="16" width="118" height="82" rx="5" fill="#f3f4f6" stroke="#8a919c"/><text x="63" y="35" text-anchor="middle" font-weight="600" font-size="10">Produtor</text><text x="63" y="52" text-anchor="middle">API com sessão</text><text x="63" y="66" text-anchor="middle">ou replay de arquivo</text><text x="63" y="86" text-anchor="middle" fill="#4a5260">valida e identifica</text>
    <rect x="144" y="16" width="118" height="82" rx="5" fill="#fdf5e6" stroke="#a2650a"/><text x="203" y="35" text-anchor="middle" font-weight="600" font-size="10">Registro durável</text><text x="203" y="52" text-anchor="middle">wal_*.jsonl</text><text x="203" y="66" text-anchor="middle">API: fsync → 202</text><text x="203" y="86" text-anchor="middle" fill="#4a5260">preparação</text>
    <rect x="284" y="16" width="118" height="82" rx="5" fill="#edf3fb" stroke="#2c5d9e"/><text x="343" y="35" text-anchor="middle" font-weight="600" font-size="10">Aplicação</text><text x="343" y="52" text-anchor="middle">estado por conta,</text><text x="343" y="66" text-anchor="middle">modelo</text><text x="343" y="86" text-anchor="middle" fill="#4a5260">em memória</text>
    <rect x="424" y="16" width="118" height="82" rx="5" fill="#ebf6ee" stroke="#2f7a45"/><text x="483" y="35" text-anchor="middle" font-weight="600" font-size="10">Confirmação</text><text x="483" y="52" text-anchor="middle">CSVs escritos;</text><text x="483" y="66" text-anchor="middle">cursores avançam</text><text x="483" y="86" text-anchor="middle" fill="#4a5260">aplicado_ate</text>
    <rect x="564" y="16" width="112" height="82" rx="5" fill="#f3f4f6" stroke="#8a919c"/><text x="620" y="35" text-anchor="middle" font-weight="600" font-size="10">Instantâneo</text><text x="620" y="52" text-anchor="middle">estado + índices;</text><text x="620" y="66" text-anchor="middle">depois poda o registro</text><text x="620" y="86" text-anchor="middle" fill="#4a5260">periódico</text>
  </g>
  <g stroke="#4a5260" stroke-width="1.3" marker-end="url(#s3)" fill="none">
    <path d="M122,57 L142,57"/><path d="M262,57 L282,57"/><path d="M402,57 L422,57"/><path d="M542,57 L562,57"/>
  </g>
  <g fill="none" stroke="#b23a3a" stroke-width="1.3" marker-end="url(#s3)">
    <path d="M412,57 L412,128 L343,128 L343,100"/>
  </g>
  <text x="676" y="122" text-anchor="end" font-size="9.3" fill="#b23a3a">falhou: reconstrói e tenta de novo (até 3 vezes)</text>
  <rect x="284" y="140" width="392" height="50" rx="5" fill="#fff" stroke="#b23a3a"/>
  <text x="480" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#b23a3a">Persistiu: isola o evento e BLOQUEIA</text>
  <text x="480" y="175" text-anchor="middle" font-size="9.3">Nada depois dele avança. Ação explícita: Repetir ou Descartar (fica gravado).</text>
  <rect x="4" y="200" width="672" height="60" rx="5" fill="#f3f4f6" stroke="#8a919c"/>
  <text x="340" y="218" text-anchor="middle" font-size="10" font-weight="600">Queda do processo em qualquer ponto</text>
  <text x="340" y="234" text-anchor="middle" font-size="9.3">Ao reiniciar nada roda. “Recuperar e iniciar”: carrega o instantâneo, devolve os CSVs ao tamanho dele e reaplica o registro.</text>
  <text x="340" y="249" text-anchor="middle" font-size="9.3">Resultado: cada evento aceito tem uma única atualização e uma única previsão. Retransmitir é reconhecido e não refaz nada.</text>
</svg>
